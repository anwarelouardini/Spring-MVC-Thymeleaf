<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1"
>
<head>
  <meta charset="UTF-8">
  <title>Products</title>
</head>
<body>
<div class="p-3" layout:fragment="content">

  <form method="post" th:action="@{/admin/saveProduct}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" name="name" th:value="${product.name}">
      <!-- S'il existe un erreur dans le champs name, afficher l'erreur -->
      <span class="text-danger" th:errors="${product.name}"></span>
    </div>
    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="text" class="form-control" name="price" th:value="${product.price}">
      <!-- S'il existe un erreur dans le champs price, afficher l'erreur -->
      <span class="text-danger" th:errors="${product.price}"></span>
    </div>
    <div class="mb-3">
      <label class="form-label">Quantite</label>
      <input type="text" class="form-control" name="quantity" th:value="${product.price}">
      <span class="text-danger" th:errors="${product.quantity}"></span>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>

</body>
</html>
